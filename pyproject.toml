[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jimoty"
version = "0.1.0"
description = "Agent-native CLI tool and Python library for Japan Jimoty (jmty.jp) listings, search, scraping, and diagnostic evaluation."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "V" }
]
keywords = ["jimoty", "jmty", "scraper", "cli", "japan", "scooter", "motorcycle", "marketplace", "diagnostics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Utilities",
]
dependencies = [
    "httpx>=0.24.0",
    "beautifulsoup4>=4.12.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
]

[project.scripts]
jimoty = "jimoty.cli:main"
jimoty-cli = "jimoty.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["jimoty*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
